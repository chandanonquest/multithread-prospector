name: CI & Secret Verification

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Secret Pre-flight Scanner
        run: python scripts/verify_no_secrets.py

      - name: Validate Python Syntax
        run: |
          python -m py_compile scripts/prospecting_workflow.py
          python -m py_compile scripts/apollo_client.py
          python -m py_compile scripts/sheets_logger.py
